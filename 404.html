<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Asymptote</title>
<script>
// Dla projektowych Pages (user.github.io/repo/...) zmień 1 na 0 lub odwrotnie, patrz niżej.

location.replace("https://asymptote.pl/" + p + location.search + location.hash);
</script></head>
